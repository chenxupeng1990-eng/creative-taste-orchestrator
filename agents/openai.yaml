interface:
  display_name: "Creative Taste Orchestrator"
  short_description: "Compare real creative proofs and improve the visible work"
  default_prompt: "Use $creative-taste-orchestrator: inspect relevant visual references, make two small comparable proofs or compare a revision with the saved baseline, judge the actual work, and fix the highest-impact failure. Preserve strengths, allow ties or rollback, and do not replace craft with novelty or long design explanations."
